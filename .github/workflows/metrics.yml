name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Base profile stats
      - uses: lowlighter/metrics@3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-base.svg
          user: Kyojurouu
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Manila

      # 2. Isometric commit calendar (full year)
      - uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-isocalendar.svg
          user: Kyojurouu
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3. Featured & pinned repositories
      - uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-repositories.svg
          user: Kyojurouu
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_repositories: yes
          plugin_repositories_pinned: 2
          plugin_repositories_starred: 0
          plugin_repositories_order: featured, pinned

      # 4. Star lists
      - uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-stars.svg
          user: Kyojurouu
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_stars: yes
          plugin_stars_limit: 4

      # 5. Languages breakdown (lightweight, no indepth cloning)
      - uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-languages.svg
          user: Kyojurouu
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      # 6. Achievements
      - uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-achievements.svg
          user: Kyojurouu
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: detailed

      # 7. Coding habits
      - uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-habits.svg
          user: Kyojurouu
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
