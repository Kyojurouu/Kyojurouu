name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Base profile stats (header + activity + community + repositories summary)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-base.svg
          user: Kyojurouu
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Manila

      # 2. Isometric commit calendar (full year)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-isocalendar.svg
          user: Kyojurouu
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3. Featured & pinned repositories
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-repositories.svg
          user: Kyojurouu
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_repositories: yes
          plugin_repositories_pinned: 2
          plugin_repositories_starred: 0
          plugin_repositories_order: featured, pinned

      # 4. Star lists
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-stars.svg
          user: Kyojurouu
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_stars: yes
          plugin_stars_limit: 4
